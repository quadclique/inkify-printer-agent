name: Build Inkify Binaries and Installers

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Triggers the pipeline when you push a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # Run three parallel jobs on different operating systems
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Base Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # Windows Build (Binary + Installer)
    # Build Binary files 
    - name:  Windows Specific Dependencies and Build Windows Binary Executable file
      if: matrix.os == 'windows-latest'
      run: | 
        pip install pywin32
        pyinstaller --name inkify-agent --onefile --hidden-import win32timezone app/main.py

    # Package the executable into an installer using Inno Setup
    - name: Package Windows Installer (Inno Setup)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir installer
        copy dist\inkify-agent.exe installer\
        copy system\windows\inkify-agent-service.exe installer\
        copy system\windows\inkify-agent-service.xml installer\
        copy system\windows\setup.iss installer\
        choco install innosetup --yes
        cd installer
        "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

    - name: Upload Windows Installer
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v3
      with:
        name: InkifySetup
        path: installer/Output/*.exe

    # macOS Build (Binary + Installer)
    # Build Binary files
    - name: Build macOS Binary Executable file
      if: matrix.os == 'macos-latest'
      run: pyinstaller --name inkify-agent --onefile app/main.py

    # Package the executable into a .pkg installer using a shell script
    - name: Package Mac Installer (.pkg)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x scripts/build-mac-pkg.sh
        ./scripts/build-mac-pkg.sh

    - name: Upload Mac Installer
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v3
      with:
        name: InkifyAgentPkg
        path: "*.pkg"

    # Linux Build (Binary + Installer)
    # Build Binary files
    - name: Build Linux Binary
      if: matrix.os == 'ubuntu-latest'
      run: pyinstaller --name inkify-agent --onefile app/main.py

    # Package the executable into a .deb installer using a shell script
    - name: Package Linux Installer (.deb)
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x scripts/build-linux-deb.sh
        ./scripts/build-linux-deb.sh

    - name: Upload Linux Installer
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v3
      with:
        name: InkifyAgentDeb
        path: "*.deb"
    
    # Upload to AWS S3
    - name: Configure AWS Credentials
      if: startsWith(github.ref, 'refs/tags/')
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # Change to your region

    - name: Upload Installer to S3 (Windows)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
      run: aws s3 cp installer/Output/InkifySetup.exe s3://inkify-installers/windows/InkifySetup.exe
       
    - name: Upload Installer to S3 (macOS)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
      run: aws s3 cp InkifyAgent_v1.0.0.pkg s3://inkify-installers/mac/InkifyAgent.pkg      
    
    - name: Upload Installer to S3 (Linux)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
      run: aws s3 cp inkify-agent_1.0.0_amd64.deb s3://inkify-installers/linux/inkify-agent.deb

    # Create GitHub Release
    - name: Release to GitHub (Windows)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest' 
      uses: softprops/action-gh-release@v1
      with:
        files: installer/Output/InkifySetup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Release to GitHub (macOS)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest' 
      uses: softprops/action-gh-release@v1
      with:
        files: "*.pkg"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release to GitHub (Linux)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' 
      uses: softprops/action-gh-release@v1
      with:
        files: "*.deb"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}